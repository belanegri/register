{% extends 'base.html' %}{% block content %}<div class="page-heading"><h1>Serviços</h1><a class="btn btn-primary" href="{% url 'comercial:servico_novo' %}">Novo serviço</a></div><form class="search-form"><input class="form-control" name="q" value="{{ q }}" placeholder="Buscar serviço"><button class="btn btn-primary">Buscar</button></form><div class="surface p-3 mt-3"><table class="table"><tr><th>Nome</th><th>Categoria</th><th>Valor padrão</th><th>Situação</th></tr>{% for s in servicos %}<tr><td><a href="{% url 'comercial:servico_editar' s.pk %}">{{ s.nome }}</a></td><td>{{ s.categoria }}</td><td>R$ {{ s.valor_padrao }}</td><td>{{ s.ativo|yesno:'Ativo,Inativo' }}</td></tr>{% empty %}<tr><td colspan="4">Nenhum serviço cadastrado.</td></tr>{% endfor %}</table></div>{% endblock %}
