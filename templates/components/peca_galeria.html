<section class="surface p-3 mb-4"><h2>Fotos do produto</h2><div class="peca-galeria">{% for foto in peca.fotos.all %}<figure><a href="{{ foto.imagem.url }}" target="_blank" rel="noopener" aria-label="Ampliar foto de {{ peca.nome }}"><img src="{{ foto.imagem.url }}" alt="{{ foto.legenda|default:peca.nome }}" loading="lazy"></a>{% if foto.legenda %}<figcaption>{{ foto.legenda }}</figcaption>{% endif %}</figure>{% empty %}<p class="text-secondary">Este produto ainda não tem foto cadastrada.</p>{% endfor %}</div>{% if user.is_staff and perms.estoque.change_peca %}<a href="{% url 'admin:estoque_peca_change' peca.pk %}">Adicionar ou gerenciar fotos</a>{% endif %}</section>
