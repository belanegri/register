{% extends 'base.html' %}{% block title %}Editar anexo{% endblock %}{% block content %}<div class="page-heading"><h1>Editar anexo · {{ anexo.conta.codigo }}</h1><a class="btn btn-outline-secondary" href="{% url 'contas:detalhe' anexo.conta_id %}">Voltar à conta</a></div><section class="surface p-4" style="max-width:760px">{% if anexo.arquivo %}<p>Arquivo atual: <a href="{% url 'contas:baixar_anexo' anexo.pk %}">{{ anexo.nome_arquivo }}</a></p>{% endif %}<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Salvar alterações</button><a class="btn btn-outline-danger" href="{% url 'contas:excluir_anexo' anexo.pk %}">Excluir anexo</a></form></section>{% endblock %}
