<div class="d-flex gap-3">{% if pagina.has_previous %}<a href="?page={{ pagina.previous_page_number }}&status={{ status|urlencode }}&q={{ q|urlencode }}&inicio={{ request.GET.inicio }}&fim={{ request.GET.fim }}">Anterior</a>{% endif %}<span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>{% if pagina.has_next %}<a href="?page={{ pagina.next_page_number }}&status={{ status|urlencode }}&q={{ q|urlencode }}&inicio={{ request.GET.inicio }}&fim={{ request.GET.fim }}">Próxima</a>{% endif %}</div>
