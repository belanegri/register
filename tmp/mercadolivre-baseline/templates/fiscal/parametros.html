{% extends 'base.html' %}{% block title %}Parâmetros fiscais{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">FISCAL</div><h1>Parâmetros fiscais · {{ tipo }}</h1></div><a href="{% url 'fiscal:configuracao' %}" class="btn btn-outline-secondary">Voltar</a></div><section class="surface p-4 mb-4"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Salvar parâmetros</button></form></section><section class="surface p-4">{% for param in parametros %}<p><a href="{% url 'fiscal:parametro_editar' tipo param.pk %}">{{ param }}</a></p>{% empty %}<p>Nenhum parâmetro fiscal cadastrado.</p>{% endfor %}</section>{% endblock %}
