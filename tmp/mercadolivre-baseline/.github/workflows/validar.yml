name: Validar REGISTER
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: register_test
          POSTGRES_PASSWORD: somente_testes_ci
          POSTGRES_DB: register_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U register_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "True"
      SECRET_KEY: somente-testes-isolados-sem-dados-reais-register-ci
      DATABASE_URL: postgresql://register_test:somente_testes_ci@localhost:5432/register_test
      STORAGE_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --settings=pontocar.test_settings --noinput
      - run: docker build -t register:validacao .
      - name: Validar configuração Gunicorn no Linux
        run: >-
          docker run --rm
          -e SECRET_KEY=validacao-isolada-sem-dados-reais-register
          -e DATABASE_URL=postgresql://test:test@localhost/test
          -e DEBUG=False -e STORAGE_MODE=local
          register:validacao gunicorn pontocar.wsgi:application --config gunicorn.conf.py --check-config
